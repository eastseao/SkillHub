memory:
  enable_versioning: true
  enable_traceability: true
  enable_compression: true

rules:
  must_track_all_changes: true
  prevent_memory_loss: true
  enforce_consistency: true
  incremental_update_only: true
  never_overwrite_history: true

storage:
  format: json
  backup_enabled: true
  retention: infinite

update_policy:
  on_chapter_complete: true
  on_arc_complete: true
  on_key_event: true