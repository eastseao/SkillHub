title_rules:
  # 必须有要素
  must_have:
    - 冲突（对抗/压制/生死）
    - 情绪刺激（愤怒/爽/惊讶/恐惧）
    - 信息缺口（好奇心/悬念）
    - 非套路化

  # 推荐要素
  recommended:
    - 数字（具体化）
    - 身份反差（废物/大帝）
    - 时间差（三年/一天）
    - 极端结果

  # 禁止要素
  forbidden:
    - 总结性语言（"修炼记录"/"成长故事"）
    - 结果已揭示（"他成为强者"）
    - 无情绪词汇
    - 无冲突平铺

  # 标题长度
  length:
    min: 10
    max: 30
    optimal: 15-25

  # 标题类型优先级
  type_priority:
    high:
      - 冲突型
      - 反转型
      - 权力型
    medium:
      - 禁忌型
      - 好奇型
    low:
      - 平铺直叙型
      - 总结型

  # 情绪词库
  emotion_words:
    strong:
      - 废物
      - 碾压
      - 跪地
      - 灭门
      - 屠戮
      - 帝级
      - 神级
      - 震惊
      - 恐怖
    medium:
      - 觉醒
      - 突破
      - 逆袭
      - 打败
      - 震惊