# 禁止使用的标题模式

## 绝对禁止

### ❌ 总结性语言

| 禁止标题 | 原因 |
|----------|------|
| 《修炼记录》 | 无冲突无情绪 |
| 《成长故事》 | 无冲突无情绪 |
| 《修仙之路》 | 套路化无新意 |
| 《我的传奇人生》 | 平铺直叙无悬念 |

### ❌ 结果已揭示

| 禁止标题 | 原因 |
|----------|------|
| 《他成为强者》 | 结果已知 |
| 《他打败了敌人》 | 结果已知 |
| 《他获得传承》 | 结果已知 |
| 《他突破成功》 | 结果已知 |

