## 高度警惕（需优化）

### ⚠️ 套路化标题

| 类型 | 示例 | 优化建议 |
|------|------|----------|
| 废物流 | "废物逆袭" | 加数字/时间差 |
| 系统流 | "神级系统" | 加具体结果 |
| 退婚流 | "被退婚后" | 加反转 |
| 修炼流 | "修炼之路" | 加冲突 |

---

## 扣分规则

| 模式 | 扣分 | 说明 |
|------|------|------|
| 总结性语言 | -30 | 完全无吸引力 |
| 结果已揭示 | -25 | 无悬念 |
| 无情绪词汇 | -20 | 无刺激 |
| 套路化 | -15 | 轻微套路 |
| 无冲突 | -20 | 完全无冲突 |