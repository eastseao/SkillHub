boost_weights:
  # 各维度提升权重
  dimension_boost:
    ctr:
      weight: 0.25
      boost_methods:
        - 标题优化
        - 开头钩子强化
        - 情绪刺激增强
      expected_boost: 15-30

    retention:
      weight: 0.25
      boost_methods:
        - 冲突密度提升
        - 节奏优化
        - 信息延迟策略
      expected_boost: 10-25

    rage:
      weight: 0.20
