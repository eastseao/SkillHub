# 禁止更改项

## 绝对禁止

- **不得改变主线剧情**
  - 关键事件不得删除或更改
  - 故事走向不得改变
  - 核心冲突不得消除

- **不得改变角色核心设定**
  - 角色性格不得OOC
  - 角色动机不得改变
  - 角色关系不得颠覆

- **不得改变世界观核心规则**
  - 力量体系不得混乱
  - 世界法则不得矛盾
  - 地理/历史不得冲突

- **不得删除关键伏笔**
  - 已埋设的伏笔不得删除
  - 关键线索不得消除
  - 后续重要剧情不得破坏

## 允许更改

- **可以增加细节**
  - 增加冲突细节
  - 增加情绪细节
  - 增加对话细节

- **可以调整顺序**
  - 场景顺序可以重排
  - 对话顺序可以调整
  - 信息揭示顺序可以延迟

- **可以强化表达**
  - 强化冲突强度
  - 强化情绪表达
  - 强化悬念钩子

- **可以删除冗余**
  - 删除环境描写
  - 删除内心独白
  - 删除闲聊对话

## 改写边界

| 项目 | 是否可改 | 边界 |
|------|----------|------|
| 主线剧情 | ❌ 不可改 | 绝对禁止 |
| 关键事件 | ❌ 不可改 | 绝对禁止 |
| 角色核心设定 | ❌ 不可改 | 绝对禁止 |
| 世界观核心规则 | ❌ 不可改 | 绝对禁止 |
| 关键伏笔 | ❌ 不可改 | 绝对禁止 |
| 细节描写 | ✓ 可改 | 可增加可删减 |
| 场景顺序 | ✓ 可改 | 不得改变因果 |
| 对话内容 | ✓ 可改 | 不得改变关键信息 |
| 情绪表达 | ✓ 可改 | 可强化可弱化 |
| 冲突强度 | ✓ 可改 | 可增强不可消除 |
| 节奏结构 | ✓ 可改 | 可加快不可拖慢 |