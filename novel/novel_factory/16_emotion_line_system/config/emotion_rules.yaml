emotion_rules:
  # 核心规则
  core_rules:
    - 情感必须贯穿全书
    - 每章必须有情绪变化
    - 情感必须影响剧情决策
    - 禁止无情绪章节
    - 情感必须可量化
    - 情绪驱动剧情，非装饰

  # 情绪触发规则
  trigger_rules:
    - 每个章节必须有至少1个情绪触发器
    - 情绪触发必须具体化（不能笼统）
    - 情绪触发必须有积累（不能忽然爆发）
    - 情绪触发后必须有行动/决策

  # 情绪跌宕规则
  fall_rise_rules:
    - 禁止持续压抑超过50章无爆发
    - 禁止持续爽感超过20章无压抑
    - 禁止情绪平稳无波动
    - 禁止单边上涨或单边下跌
    - 压抑后必须有释放
    - 爽点后必须有新威胁

  # 情绪衰减规则
  decay_rules:
    - 大爽点后必须3章内有新威胁铺垫
    - 情绪低谷不能超过20章
    - 每50章必须有中爽点
    - 每100章必须有超大爽点
    - 情绪永远不能完全归零

  # 情绪同步规则
  sync_rules:
    - 每个剧情节点必须有情绪变化
    - 每个情绪变化必须推动剧情
    - 禁止有剧情无情绪变化
    - 禁止有情绪变化无角色决策
    - 禁止有决策无新剧情
    - 禁止情绪和剧情不匹配

  # 禁止模式
  forbidden:
    - 无情绪波动的"水文"
    - 情绪与剧情脱节
    - 主角"无感"状态
    - 情绪触发无行动
    - 同一个触发器反复使用
    - 毫无铺垫的突然背叛
    - 轻易原谅背叛