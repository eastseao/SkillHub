forbidden_styles:
  - 现代碎片化叙事（除非设定允许）
  - 无意义散文式描写
  - 角色语气混乱
  - 无冲突闲聊
  - 超过200字的环境描写
  - 超过500字的静止段落
  - 无意义的内心独白

forbidden_patterns:
  - "突然"作为冲突引入（除非紧急）
  - "只见"作为动作开始
  - 连续三个自然段无冲突
  - 同一角色连续三段内心独白

forbidden_dialogue:
  - 打招呼寒暄超过2句
  - 无目的的闲聊对话
  - 自我介绍超过3句
  - 解释性独白

forbidden_narration:
  - 先描写后冲突
  - 场景描写超过10%
  - 背景说明超过5%