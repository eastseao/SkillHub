rejection:
  if_plot_break: true
  if_character_ooc: true
  if_world_break: true
  if_power_collapse: true
  if_water_content_over_50: true
  if_no_hook: true
  if_total_score_below_70: true
  auto_fail_on_critical: true

critical_issues:
  - 剧情逻辑断裂（无法自圆其说）
  - 角色彻底崩坏（与设定完全不符）
  - 世界法则崩坏（违反自身规则）
  - 战力体系崩溃（数值完全不合理）
  - 严重水文（50%以上无意义内容）

high_issues:
  - 剧情明显漏洞
  - 角色轻微OOC
  - 节奏严重拖沓
  - 战力轻微失衡
  - 风格漂移

medium_issues:
  - 描写冗余
  - 钩子不够强
  - 情绪不够饱满
  - 信息密度低

low_issues:
  - 轻微水文
  - 细节可优化
  - 语言可精炼